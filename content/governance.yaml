governance:
  title: "Governança que orienta sem criar uma segunda linha de comando"
  principles:
    - "A linha hierárquica executiva é explícita: os Heads respondem ao CEO."
    - "Orientação, provocação e recomendação não transferem accountability."
    - "Conselho governa; Comitê aprofunda; CEO e Heads decidem e executam dentro de suas alçadas."
    - "Uma recomendação de Luiz, Lucas, César, Murilo ou do Comitê não é uma ordem operacional."

  bodies:
    - id: conselho
      name: "Conselho Estratégico"
      purpose: "Orientar estratégia, acompanhar resultados, riscos, capital e evolução da liderança executiva."
      composition:
        confirmed:
          - "Luiz — Sócio"
          - "Lucas — Sócio"
          - "Paulo — Sócio e CEO"
          - "César — Advisor externo"
      question: "Estamos indo na direção correta?"
      does:
        - "Tensiona e orienta a estratégia."
        - "Acompanha resultados e riscos relevantes."
        - "Discute alocação de capital e grandes escolhas."
        - "Acompanha a evolução do CEO e do modelo de liderança."
      doesNot:
        - "Gerenciar equipes."
        - "Distribuir tarefas."
        - "Operar backlog."
        - "Dar ordens operacionais diretamente aos Heads."
        - "Substituir CEO ou Heads nas decisões executivas."
      note: >
        Algumas matérias continuam reservadas aos sócios enquanto proprietários, mesmo que os sócios participem do Conselho.

    - id: materias-socios
      name: "Matérias reservadas aos sócios"
      purpose: "Preservar decisões patrimoniais e societárias que pertencem aos proprietários."
      examples:
        - "Entrada ou saída de sócios."
        - "Alterações societárias relevantes."
        - "Distribuição de resultados e temas patrimoniais."
        - "Venda, combinação ou transação societária relevante."
      display: "nota-de-governanca"

    - id: comite
      name: "Comitê de Crescimento & Transformação"
      purpose: >
        Ser um fórum estruturado de aprofundamento, aprendizagem e construção de recomendações,
        aumentando a qualidade das decisões sem substituir quem tem autoridade para decidir.
      question: "O que precisamos compreender melhor antes de decidir ou agir?"
      composition:
        confirmed:
          - "Conselho Estratégico — Luiz, Lucas, Paulo e César"
          - "Murilo — Consultor externo"
          - "Head de Crescimento"
          - "Head de Operações"
          - "Head de Ofertas & Portfólio"
          - "Head de Tecnologia & Engenharia"
      does:
        - "Aprofunda temas estratégicos e hipóteses."
        - "Expõe Conselho, CEO e Heads a mais informação e perspectivas."
        - "Ouve os líderes responsáveis pelo tema."
        - "Tensiona alternativas e premissas."
        - "Avalia aprendizados e evidências."
        - "Constrói recomendações."
      doesNot:
        - "Gerenciar pessoas ou áreas."
        - "Distribuir tarefas."
        - "Definir backlog."
        - "Dar ordem operacional a um Head."
        - "Substituir o CEO ou o Head accountable."
        - "Transformar a reunião em fórum de microdecisão operacional."
      mantra: "O Comitê aumenta a qualidade das decisões. Não toma o lugar de quem tem autoridade para decidir."

    - id: gestao-executiva
      name: "Gestão Executiva"
      purpose: "Transformar direção em escolhas, prioridades e execução."
      composition:
        confirmed:
          - "CEO"
          - "Heads das macroáreas"
      question: "O que faremos, quem é accountable e como vamos executar?"
      does:
        - "Decide dentro das alçadas definidas."
        - "Define prioridades e compromissos."
        - "Opera e transforma as áreas."
        - "Desenvolve pessoas, capacidades e papéis."
      mantra: "O Head pode ouvir muitas vozes. A decisão dentro da sua alçada continua sendo sua, e sua prestação de contas é ao CEO."
