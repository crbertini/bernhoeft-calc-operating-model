hero:
  eyebrow: "Transformação organizacional"
  title: "Disciplina para Operar. Ousadia para Transformar."
  subtitle: >
    Evoluir a forma de operar sem perder o que tornou a CALC forte — e construir
    as capacidades necessárias para escalar conhecimento, tecnologia, IA e dados.

thesis:
  title: "A CALC que estamos construindo"
  statement: >
    O próximo ciclo de crescimento exige fazer a receita crescer mais rapidamente que a
    necessidade de crescimento do headcount. Isso não é uma tese de redução de pessoas:
    é uma tese de produtividade, escala e alavancagem do conhecimento por processos,
    tecnologia, IA, soluções híbridas, software e ativos de dados.
  economicNorthStar: >
    Aumentar de forma sustentável a receita e a margem geradas por unidade de conhecimento humano proprietário.

continuum:
  title: "Nem todo serviço precisa virar software"
  description: >
    Cada oferta deve encontrar o ponto de maior valor econômico e experiência para o cliente.
  stages:
    - "Serviço humano especializado"
    - "Serviço aumentado por tecnologia e IA"
    - "Managed Service altamente automatizado"
    - "Solução híbrida"
    - "Produto de software"
    - "Produto de dados e inteligência"

fromTo:
  - from: "Conhecimento concentrado nas pessoas"
    to: "Conhecimento institucional, reutilizável e escalável"
  - from: "Receita cresce quase junto com headcount"
    to: "Receita cresce mais rápido que a necessidade de pessoas"
  - from: "Serviços isolados"
    to: "Portfólio econômico de soluções"
  - from: "Tecnologia como suporte"
    to: "Tecnologia como parte da proposta de valor"
  - from: "Dados como registro da operação"
    to: "Dados como inteligência, diferenciação e novas ofertas"
  - from: "Estrutura baseada principalmente em cargos"
    to: "Organização orientada a papéis, capacidades e accountabilities"
  - from: "Líder como resolvedor"
    to: "Líder que cria autonomia, disciplina e capacidade no time"
  - from: "Cliente compra execução"
    to: "Cliente percebe e compra resultado"
  - from: "Melhorar o atual"
    to: "Melhorar o atual e construir o próximo"

principles:
  - title: "Macroestrutura clara, desenho local flexível"
    description: >
      A empresa define macroáreas, missões, accountabilities e interfaces. Cada Head desenha os papéis necessários dentro da sua área.
  - title: "Capacidade não é cargo"
    description: >
      Product Management, RevOps ou Produtos de Dados podem ser capacidades necessárias sem exigir imediatamente posições dedicadas.
  - title: "Pessoa não é papel"
    description: >
      Uma pessoa pode exercer mais de um papel; um papel pode existir sem ocupante e só deve virar posição dedicada quando escala e complexidade justificarem.
  - title: "Accountability exige autoridade"
    description: >
      Quem responde por um resultado precisa ter alçada suficiente para tomar as decisões necessárias.
  - title: "Ofertas administra o portfólio econômico"
    description: >
      A área decide quais problemas atacar, quais ofertas criar, experimentar, evoluir, automatizar, manter ou retirar, e como capturar valor.
  - title: "Produto e Tecnologia são distintos"
    description: >
      Ofertas define o que e por quê; Tecnologia define como construir e operar de forma sustentável.
  - title: "Operar e transformar acontecem juntos"
    description: >
      Disciplina operacional e transformação não são times separados: cada líder deve melhorar o presente e construir o próximo.

futureCapabilities:
  title: "Capacidades que queremos construir para o próximo ciclo"
  items:
    - title: "Data & Intelligence"
      description: >
        Transformar dados operacionais em inteligência, diferenciação e novas ofertas. É uma ambição estratégica, não uma nova caixa obrigatória agora.
    - title: "Garanhuns como polo de capacidades"
      description: >
        O investimento e desenvolvimento de talentos em Garanhuns pode ajudar a formar capacidades futuras em dados, tecnologia e conhecimento — a tese deve ser desenvolvida antes de definir estrutura.
    - title: "Inovação dentro de Portfólio & Ofertas"
      description: >
        Inovação deixa de depender de iniciativas informais: hipóteses, experimentos e MVPs são puxados e organizados dentro da lógica de portfólio.

metricsFramework:
  title: "Não basta medir o resultado final. Precisamos medir se o modelo está realmente mudando."
  problem: >
    Receita, EBITDA e margem continuam essenciais, mas são indicadores tardios. Sozinhos, eles não mostram se a CALC está ficando mais escalável, se o conhecimento está deixando de depender de pessoas específicas ou se tecnologia e IA estão mudando de fato a economia da operação.
  principle: >
    Cada dimensão deve combinar um indicador de resultado com indicadores que expliquem por que o resultado está mudando. O objetivo não é maximizar uma métrica isolada, mas observar o sistema: mais produtividade sem piorar qualidade; mais automação sem piorar experiência; mais software sem destruir margem ou aderência do cliente.

transformationMetrics:
  - id: economic_leverage
    label: "1. Alavancagem econômica do conhecimento"
    question: "A receita e a margem estão crescendo mais rápido que a necessidade de capacidade humana?"
    outcome: "Receita e margem de contribuição por FTE operacional."
    drivers:
      - "Receita líquida / FTE operacional médio."
      - "Margem de contribuição / FTE operacional."
      - "Crescimento de receita versus crescimento de headcount operacional."
    interpretation: >
      É a tradução mais direta da North Star econômica. O avanço é real quando receita e margem crescem sem exigir crescimento proporcional de pessoas.
    example: >
      Se a receita cresce 20% e o headcount operacional cresce 5%, há evidência de alavancagem. Se ambos crescem 20%, a empresa cresceu, mas o modelo econômico pouco mudou.

  - id: straight_through
    label: "2. Automação que muda a operação"
    question: "Quanto do trabalho flui sem depender de intervenção humana?"
    outcome: "% do volume elegível concluído sem intervenção humana."
    drivers:
      - "% de etapas automatizadas por fluxo."
      - "Número médio de intervenções humanas por entrega."
      - "Tempo de ciclo antes e depois da automação."
    interpretation: >
      Contar robôs, agentes ou funcionalidades de IA mede atividade, não transformação. O que importa é reduzir trabalho manual real em processos relevantes.
    example: >
      Automatizar 80% de uma etapa que representa apenas 5% do esforço total quase não altera a economia. Automatizar de ponta a ponta um fluxo que concentra grande parte das horas operacionais altera o modelo.

  - id: productivity_quality
    label: "3. Produtividade sem sacrificar qualidade"
    question: "Estamos produzindo mais com a mesma capacidade sem transferir custo para retrabalho, erro ou cliente?"
    outcome: "Output por FTE combinado com qualidade, SLA e retrabalho."
    drivers:
      - "Cálculos ou entregas por FTE."
      - "% de retrabalho e taxa de erro."
      - "Cumprimento de SLA e tempo de ciclo."
    interpretation: >
      Produtividade isolada pode ser enganosa. Ela só representa evolução quando aumenta enquanto qualidade e experiência permanecem estáveis ou melhoram.
    example: >
      Sair de 14 para 20 cálculos por pessoa/dia é positivo se erros e retrabalho não aumentarem. Se o ganho exigir mais correções posteriores, parte da produtividade é apenas aparente.

  - id: reusable_knowledge
    label: "4. Conhecimento institucional e reutilizável"
    question: "Quanto do valor entregue depende de conhecimento codificado e reutilizável, e não apenas de especialistas individuais?"
    outcome: "% do volume ou receita apoiado por ativos de conhecimento reutilizáveis."
    drivers:
      - "% de regras, modelos, componentes e metodologias codificados."
      - "Reutilização dos mesmos ativos entre clientes, times e ofertas."
      - "Redução da dependência de especialistas para decisões recorrentes."
    interpretation: >
      Essa dimensão mede se o principal ativo da empresa está migrando da cabeça das pessoas para um patrimônio institucional que pode ser reutilizado e amplificado.
    example: >
      Uma regra fiscal registrada em um documento não é necessariamente escalável. Quando ela passa a alimentar metodologia, validações automáticas, IA ou software reutilizado em centenas de casos, virou um ativo econômico.

  - id: portfolio_evolution
    label: "5. Evolução econômica do portfólio"
    question: "O mix de ofertas está migrando para formatos mais escaláveis e economicamente melhores?"
    outcome: "Receita e margem por tipo de oferta e por estágio do continuum."
    drivers:
      - "Mix de receita: serviço tradicional, tech-enabled, híbrido, software e dados."
      - "Margem de contribuição por oferta."
      - "Adoção, retenção e expansão das novas ofertas."
    interpretation: >
      Lançar produtos não é transformação. A mudança acontece quando ofertas novas ganham adoção, melhoram a economia e passam a representar parcela relevante do portfólio.
    example: >
      Um produto de software com pouca adoção não vale mais que um serviço altamente automatizado e rentável. O objetivo é encontrar, para cada problema, o formato que maximiza valor para o cliente e qualidade econômica para a CALC.
